events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ==========================================
    # GZIP SIKISTIRMA (SEO ve Performans)
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    # text/html varsayilan olarak eklidir, listeden cikarildi.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        font/woff
        font/woff2
        image/svg+xml;

    # ==========================================
    # LOGGING
    # ==========================================
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;

    # ==========================================
    # RATE LIMITING ZONELARI (Cloudflare Real-IP)
    # ==========================================
    map $http_cf_connecting_ip $client_real_ip {
        default $http_cf_connecting_ip;
        ""      $binary_remote_addr;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $arg__rsc $rsc_robots_tag {
        default "noindex, nofollow";
        ""      "";
    }
    limit_req_zone $client_real_ip zone=auth_limit:10m rate=15r/m;
    limit_req_zone $client_real_ip zone=api_limit:10m rate=30r/s;

    # ==========================================
    # WWW -> NON-WWW 301 (SEO: tek tercih edilen alan adi)
    # ==========================================
    server {
        listen 80;
        server_name www.kaosmanga.net;
        return 301 https://kaosmanga.net$request_uri;
    }

    # ==========================================
    # SUNUCU KONFIGURASYON
    # ==========================================
    server {
        listen 80;
        server_name kaosmanga.net _;

        # HTTP -> HTTPS 301
        # Cloudflare origin'e hep 80 uzerinden gelir; ziyaretcinin gercek
        # semasi X-Forwarded-Proto header'indadir. Kosulsuz redirect
        # yapsaydik sonsuz donguye girerdik.
        if ($http_x_forwarded_proto = "http") {
            return 301 https://kaosmanga.net$request_uri;
        }

        # Dosya yükleme boyutu
        client_max_body_size 50M;

        # Docker'in kendi DNS cozumleyicisi (Nginx'in baslarken cokmemesi icin)
        resolver 127.0.0.11 valid=30s;

        # ==========================================
        # AUTH /me -> STANDART API RATE LIMITI (Sayfa yuklemelerinde kisitlanmasin)
        # ==========================================
        location = /api/auth/me {
            limit_req zone=api_limit burst=60 nodelay;
            limit_req_status 429;
            proxy_pass http://backend:8000/auth/me;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 60;
            proxy_connect_timeout 60;
        }

        # ==========================================
        # AUTH ISTEKLERI -> BACKEND (Siki Rate Limit)
        # ==========================================
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://backend:8000/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 60;
            proxy_connect_timeout 60;
        }

        # ==========================================
        # API ISTEKLERI -> BACKEND (FastAPI :8000)
        # ==========================================
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            limit_req_status 429;
            proxy_pass http://backend:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
        }

        # ==========================================
        # STATIC DOSYALAR -> BACKEND (Resimler)
        # ==========================================
        location /static/ {
            proxy_pass http://backend:8000/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Statik dosyalar icin cache ve MIME sniffing korumasi
            expires 7d;
            add_header Cache-Control "public, max-age=604800, no-transform" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ==========================================
        # DB ADMIN PANELI -> YALNIZCA LOCALHOST / SSH TUNELI
        # Erisim: ssh -L 8000:127.0.0.1:8000 user@server
        # ==========================================
        location = /db-admin {
            allow 127.0.0.1;
            deny all;
            return 403;
        }

        location /db-admin/ {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://backend:8000/db-admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Admin HTML Cloudflare'da 1 yil kalmasin (eski menunun donmesinin sebebi)
        location ^~ /admin {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_hide_header Cache-Control;
            proxy_hide_header CDN-Cache-Control;
            proxy_hide_header Cloudflare-CDN-Cache-Control;
            add_header Cache-Control "private, no-store, no-cache, max-age=0, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
        }

        location ^~ /login-admin {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_hide_header Cache-Control;
            proxy_hide_header CDN-Cache-Control;
            proxy_hide_header Cloudflare-CDN-Cache-Control;
            add_header Cache-Control "private, no-store, no-cache, max-age=0, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
        }

        # ==========================================
        # NEXT.JS DERLENMIS VARLIKLAR (hash'li, sonsuz cache)
        # ==========================================
        location /_next/static/media/ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Robots-Tag "noindex" always;
        }

        location /_next/static/ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ==========================================
        # MANIFEST & FAVICON (Googlebot WRS erisir, dizine eklenmez)
        # ==========================================
        location = /manifest.webmanifest {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            add_header X-Robots-Tag "noindex" always;
        }

        location = /favicon.ico {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            add_header X-Robots-Tag "noindex" always;
        }

        # ==========================================
        # OPTIMIZE EDILMIS GORSELLER
        # ==========================================
        location /_next/image {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_read_timeout 60;
            # Next.js kendi Cache-Control'unu (31 gun) gonderir
        }

        # ==========================================
        # HER SEY -> FRONTEND (Next.js :3000)
        # ==========================================
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            add_header X-Robots-Tag $rsc_robots_tag always;
        }
    }
}
