version: '3.8'

services:
  db:
    image: postgres:15
    container_name: webtoon_db
    restart: always
    environment:
      POSTGRES_USER: webtoon_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: webtoon_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webtoon_network
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webtoon_admin -d webtoon_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: webtoon_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_CONNECTION: ${DB_CONNECTION}
      SECRET_KEY: ${SECRET_KEY}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    volumes:
      - ./Backend/static:/app/static
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - webtoon_network
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: webtoon_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=4096"
    networks:
      - webtoon_network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/robots.txt >/dev/null 2>&1 || node -e \"fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: webtoon_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - webtoon_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: webtoon_pgadmin
    restart: always
    profiles:
      - debug
    # PGADMIN_DEFAULT_* sadece volume BOŞKEN (ilk açılış) yazılır.
    # Başlatmak için: docker compose --profile debug up -d pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@kaosmanga.net}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - webtoon_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  webtoon_network:
    driver: bridge
